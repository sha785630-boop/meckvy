<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        background: #050505;
        color: #f4f4f5;
      }
      h1 { font-size: 16px; margin: 0 0 4px; color: #fff; }
      .powered { font-size: 11px; color: #71717a; margin: 0 0 12px; }
      p { font-size: 12px; color: #a1a1aa; margin: 0 0 12px; line-height: 1.4; }
      .status {
        font-size: 12px; padding: 8px; background: #111;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px; font-weight: 600; color: #f87171;
      }
      .feats { font-size: 11px; color: #71717a; margin: 10px 0 0; line-height: 1.5; }
      label { font-size: 11px; display: block; margin-top: 12px; color: #71717a; }
      input {
        width: 100%; box-sizing: border-box; margin-top: 4px;
        padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
        background: #111; color: #f4f4f5; font-size: 12px;
      }
      button {
        margin-top: 10px; width: 100%; padding: 8px;
        background: #ef4444; color: #fff; border: none; border-radius: 8px;
        font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>LinkShield</h1>
    <p class="powered">Powered by Meckvy</p>
    <p>Auto-scans messages, blocks scam clicks, and shares threats with the community.</p>
    <div class="status" id="status">Protection active</div>
    <p class="feats">✓ Click blocking · ✓ Community blocklist · ✓ Instant alerts</p>
    <label>API server</label>
    <input id="apiBase" type="text" placeholder="https://meckvy.vercel.app" />
    <button id="save">Save</button>
    <script src="popup.js"></script>
  </body>
</html>
